name: RAZZO Public Worker V7
on:
  repository_dispatch:
    types: [razzo-work-item]
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      RAZZO_WORK_ITEM: ${{ toJson(github.event.client_payload) }}
      RAZZO_FABRIC_TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Persist worker start
        env:
          STATUS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64,json,os,time,urllib.error,urllib.request
          raw=json.loads(os.environ['RAZZO_WORK_ITEM']); lease=raw.get('lease',raw)
          status={'schema':'razzo.public-worker-status.v1','state':'started','workflowRunId':os.environ['RUN_ID'],'cycleId':lease['cycleId'],'workItemId':lease['workItemId'],'shard':os.environ['GITHUB_REPOSITORY'].split('/')[-1],'projectId':lease['projectId'],'repository':lease['repository'],'exactInputSha':lease['exactInputSha'],'updatedEpoch':time.time()}
          repo=os.environ['GITHUB_REPOSITORY']; url=f'https://api.github.com/repos/{repo}/contents/razzo-public-worker-status.json'; headers={'Authorization':f"Bearer {os.environ['STATUS_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          sha=None
          try:
              q=urllib.request.Request(url,headers=headers); sha=json.load(urllib.request.urlopen(q,timeout=30))['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':f"RAZZO status: started {lease['workItemId']}",'content':base64.b64encode((json.dumps(status,indent=2)+'\n').encode()).decode(),'branch':'main'}
          if sha: body['sha']=sha
          q=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='PUT'); urllib.request.urlopen(q,timeout=30).read()
          PY
      - run: curl -fsSL https://raw.githubusercontent.com/giovannifidel-collab/pfarma-ci/main/razzo/public_fabric/shard_worker.py -o shard_worker.py
      - run: python shard_worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: razzo-receipt-${{ github.event.client_payload.workItemId }}, path: receipt.json}
      - name: Return sanitized receipt
        if: always()
        env:
          TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          raw=json.loads(os.environ['RAZZO_WORK_ITEM']); lease=raw.get('lease',raw)
          try: r=json.load(open('receipt.json'))
          except Exception as exc:
              now=time.time(); r={'cycleId':lease['cycleId'],'generation':lease['generation'],'workItemId':lease['workItemId'],'shard':os.environ['GITHUB_REPOSITORY'].split('/')[-1],'projectId':lease['projectId'],'repository':lease['repository'],'exactInputSha':lease['exactInputSha'],'collisionDomain':lease['collisionDomain'],'attempt':lease.get('attempt',1),'startedEpoch':now,'endedEpoch':now,'status':'failed','error':f'receipt unavailable: {exc}'}
          envelope={'schema':'razzo.receipt-envelope.v1','workItemId':r['workItemId'],'receipt':r}
          q=urllib.request.Request('https://api.github.com/repos/giovannifidel-collab/pfarma-ci/dispatches',data=json.dumps({'event_type':'razzo-receipt','client_payload':envelope}).encode(),method='POST'); q.add_header('Authorization',f"Bearer {os.environ['TOKEN']}"); q.add_header('Accept','application/vnd.github+json'); q.add_header('Content-Type','application/json'); urllib.request.urlopen(q,timeout=30).read()
          PY
      - name: Persist worker terminal state
        if: always()
        env:
          STATUS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64,json,os,time,urllib.error,urllib.request
          raw=json.loads(os.environ['RAZZO_WORK_ITEM']); lease=raw.get('lease',raw)
          try: receipt=json.load(open('receipt.json'))
          except Exception as exc: receipt={'status':'failed','error':f'receipt unavailable: {exc}'}
          status={'schema':'razzo.public-worker-status.v1','state':receipt.get('status','failed'),'workflowRunId':os.environ['RUN_ID'],'cycleId':lease['cycleId'],'workItemId':lease['workItemId'],'shard':os.environ['GITHUB_REPOSITORY'].split('/')[-1],'projectId':lease['projectId'],'repository':lease['repository'],'exactInputSha':lease['exactInputSha'],'observedSha':receipt.get('observedSha'),'durationSeconds':receipt.get('durationSeconds'),'error':receipt.get('error'),'updatedEpoch':time.time()}
          repo=os.environ['GITHUB_REPOSITORY']; url=f'https://api.github.com/repos/{repo}/contents/razzo-public-worker-status.json'; headers={'Authorization':f"Bearer {os.environ['STATUS_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'}; q=urllib.request.Request(url,headers=headers); sha=json.load(urllib.request.urlopen(q,timeout=30))['sha']
          body={'message':f"RAZZO status: {status['state']} {lease['workItemId']}",'content':base64.b64encode((json.dumps(status,indent=2)+'\n').encode()).decode(),'branch':'main','sha':sha}; q=urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='PUT'); urllib.request.urlopen(q,timeout=30).read()
          PY
